<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tokyo Live Weather</title>
<style>
  :root {
    /* Change these two lines if your image files have different names */
    --day-img: url("tokyo.png");
    --night-img: url("tokyo-night.png");
    --sky1: #7cc4ff;
    --sky2: #cfe9ff;
    --sky3: #fff3d6;
    --text: #ffffff;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: grid;
    place-items: center;
    overflow: hidden;
    background: linear-gradient(160deg, var(--sky1), var(--sky2) 55%, var(--sky3));
    background-size: 220% 220%;
    animation: skydrift 40s ease-in-out infinite alternate;
    font-family: Roboto, Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  @keyframes skydrift { from { background-position: 0% 0%; } to { background-position: 100% 100%; } }

  /* blurred glow of the city image behind the card */
  .backdrop {
    position: fixed;
    inset: -12%;
    background: var(--day-img) center / cover no-repeat;
    filter: blur(55px) saturate(1.4);
    opacity: .5;
    z-index: 0;
    animation: breathe 18s ease-in-out infinite alternate;
  }
  body.night .backdrop {
    background-image: var(--night-img);
    filter: blur(55px) saturate(1.3) brightness(1.5);
    opacity: .55;
  }
  @keyframes breathe { from { transform: scale(1) translate(0, 0); } to { transform: scale(1.08) translate(-1.5%, 1.5%); } }

  /* slow drifting light orbs */
  .orb {
    position: fixed;
    border-radius: 50%;
    filter: blur(60px);
    opacity: .35;
    z-index: 0;
    pointer-events: none;
  }
  .orb.a { width: 46vmax; height: 46vmax; left: -12vmax; top: -10vmax; background: var(--sky3); animation: float1 26s ease-in-out infinite alternate; }
  .orb.b { width: 40vmax; height: 40vmax; right: -12vmax; bottom: -12vmax; background: var(--sky1); animation: float2 32s ease-in-out infinite alternate; }
  @keyframes float1 { to { transform: translate(18vmax, 12vmax); } }
  @keyframes float2 { to { transform: translate(-16vmax, -10vmax); } }

  #fxPage {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 1;
  }

  .card {
    position: relative;
    z-index: 2;
    width: min(92vw, 720px);
    aspect-ratio: 720 / 663;
    border-radius: 28px;
    overflow: hidden;
    background: #cfd3d5;
    color: var(--text);
    text-shadow: 0 1px 6px rgba(0, 0, 0, .35);
    box-shadow: 0 30px 90px rgba(0, 0, 0, .35), 0 0 0 1px rgba(255, 255, 255, .25);
  }
  .card::before {
    content: "";
    position: absolute;
    inset: 0;
    background: var(--day-img) center / cover no-repeat;
  }
  .card.night::before {
    background-image: var(--night-img);
    filter: brightness(1.5) contrast(1.05) saturate(1.1);
  }
  #fx {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }
  .left  { z-index: 1; position: absolute; top: 5%; left: 6%; }
  .right { z-index: 1; position: absolute; top: 5%; right: 6%; text-align: right; }
  .city  { font-size: clamp(26px, 6.5vw, 46px); font-weight: 700; margin: 0; }
  .time  { font-size: clamp(28px, 7vw, 48px); font-weight: 700; margin: .25em 0 0; }
  .date  { font-size: clamp(18px, 4.5vw, 30px); font-weight: 600; margin: .1em 0 0; opacity: .9; }
  .temp  { font-size: clamp(28px, 7vw, 48px); font-weight: 700; margin: 0; }
  .cond  { font-size: clamp(16px, 4vw, 26px); font-weight: 600; margin: .1em 0 0; }

  @media (prefers-reduced-motion: reduce) {
    body, .backdrop, .orb { animation: none; }
  }
</style>
</head>
<body>
  <div class="backdrop"></div>
  <div class="orb a"></div>
  <div class="orb b"></div>
  <canvas id="fxPage" aria-hidden="true"></canvas>

  <main class="card" aria-live="polite">
    <canvas id="fx" aria-hidden="true"></canvas>
    <div class="left">
      <h1 class="city">🇯🇵 Tokyo</h1>
      <p class="time" id="time">--:--</p>
      <p class="date" id="date"></p>
    </div>
    <div class="right">
      <p class="temp" id="temp">--°</p>
      <p class="cond" id="cond">Loading…</p>
    </div>
  </main>

<script>
  const TZ = "Asia/Tokyo";
  const API = "https://api.open-meteo.com/v1/forecast" +
    "?latitude=35.6762&longitude=139.6503" +
    "&current=temperature_2m,weather_code,is_day&timezone=" + encodeURIComponent(TZ);

  const CODES = {
    0: "Clear", 1: "Mostly clear", 2: "Partly cloudy", 3: "Overcast",
    45: "Fog", 48: "Fog",
    51: "Drizzle", 53: "Drizzle", 55: "Drizzle",
    56: "Freezing drizzle", 57: "Freezing drizzle",
    61: "Light rain", 63: "Rain", 65: "Heavy rain",
    66: "Freezing rain", 67: "Freezing rain",
    71: "Light snow", 73: "Snow", 75: "Heavy snow", 77: "Snow grains",
    80: "Showers", 81: "Showers", 82: "Heavy showers",
    85: "Snow showers", 86: "Snow showers",
    95: "Thunderstorm", 96: "Thunderstorm", 99: "Thunderstorm"
  };

  // Test links: ?mode=day|night and/or ?weather=clear|clouds|overcast|fog|drizzle|rain|heavyrain|snow|storm
  const params = new URLSearchParams(location.search);
  const FORCED_MODE = params.get("mode");
  const FORCED_WX = params.get("weather");

  const card = document.querySelector(".card");
  const root = document.documentElement;
  let effect = "clear";

  function effectFor(code) {
    if (code <= 1) return "clear";
    if (code === 2) return "clouds";
    if (code === 3) return "overcast";
    if (code === 45 || code === 48) return "fog";
    if (code >= 51 && code <= 57) return "drizzle";
    if ((code >= 61 && code <= 67) || (code >= 80 && code <= 82)) return code === 65 || code === 82 ? "heavyrain" : "rain";
    if ((code >= 71 && code <= 77) || code === 85 || code === 86) return "snow";
    if (code >= 95) return "storm";
    return "clear";
  }

  /* Page background colors: [day], [night] per weather */
  const SKIES = {
    clear:     [["#6db8ff", "#cfe9ff", "#fff0cf"], ["#070d24", "#1d2c5c", "#3b4f8f"]],
    clouds:    [["#8fb0d0", "#d3e0ec", "#f1f4f7"], ["#10182e", "#2b3858", "#4a5878"]],
    overcast:  [["#9aa5b0", "#cfd5da", "#e8eaec"], ["#141a26", "#2e3644", "#505a6a"]],
    fog:       [["#bcc4ca", "#dfe3e6", "#f2f3f4"], ["#1a202b", "#363e4b", "#59626f"]],
    drizzle:   [["#7d90a6", "#b3c0cc", "#d5dde4"], ["#0e1520", "#263242", "#3f4e63"]],
    rain:      [["#6c7f95", "#a2b1c0", "#ccd6df"], ["#0a111b", "#1f2b3a", "#364659"]],
    heavyrain: [["#56677c", "#8696a8", "#b5c1cd"], ["#070c14", "#18222f", "#2c3a4b"]],
    storm:     [["#3b4757", "#64738a", "#97a5b6"], ["#05080f", "#121a26", "#25303f"]],
    snow:      [["#c3d3e6", "#e6eef7", "#fafcff"], ["#18233b", "#3a4b72", "#6a7da6"]]
  };

  function applySky() {
    const night = card.classList.contains("night");
    const [a, b, c] = (SKIES[effect] || SKIES.clear)[night ? 1 : 0];
    root.style.setProperty("--sky1", a);
    root.style.setProperty("--sky2", b);
    root.style.setProperty("--sky3", c);
  }

  function tickClock() {
    const now = new Date();
    document.getElementById("time").textContent = new Intl.DateTimeFormat("en-US", {
      timeZone: TZ, hour: "numeric", minute: "2-digit", hour12: true
    }).format(now).toLowerCase();
    document.getElementById("date").textContent = new Intl.DateTimeFormat("en-US", {
      timeZone: TZ, month: "short", day: "numeric"
    }).format(now);
  }

  function setNight(isNight) {
    if (FORCED_MODE === "day") isNight = false;
    if (FORCED_MODE === "night") isNight = true;
    card.classList.toggle("night", isNight);
    document.body.classList.toggle("night", isNight);
    applySky();
  }

  function guessNight() {
    const hour = Number(new Intl.DateTimeFormat("en-US", {
      timeZone: TZ, hour: "numeric", hour12: false
    }).format(new Date()));
    setNight(hour < 6 || hour >= 18);
  }

  async function loadWeather() {
    try {
      const res = await fetch(API);
      if (!res.ok) throw new Error(res.status);
      const { current } = await res.json();
      document.getElementById("temp").textContent = Math.round(current.temperature_2m) + "°";
      document.getElementById("cond").textContent = CODES[current.weather_code] || "—";
      setEffect(FORCED_WX || effectFor(current.weather_code));
      setNight(current.is_day === 0);
    } catch (e) {
      document.getElementById("cond").textContent = "Weather unavailable";
    }
  }

  /* ---------- Weather effects: one layer on the card, one on the whole page ---------- */
  const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const rnd = (a, b) => a + Math.random() * (b - a);
  const RAINY = ["drizzle", "rain", "heavyrain", "storm"];

  class Layer {
    constructor(canvas, sizeFn) {
      this.cv = canvas; this.ctx = canvas.getContext("2d"); this.sizeFn = sizeFn;
      this.items = []; this.flash = 0; this.nextFlash = 3;
    }
    resize() {
      const { w, h } = this.sizeFn();
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      this.W = w; this.H = h;
      this.cv.width = Math.round(w * dpr); this.cv.height = Math.round(h * dpr);
      this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      this.build();
    }
    build() {
      const { W, H } = this;
      const k = Math.min(Math.max((W * H) / (720 * 663), 1), 3.5);
      const base = { drizzle: 70, rain: 150, heavyrain: 260, storm: 260, snow: 110, fog: 6, clouds: 4, overcast: 7, clear: 55 }[effect] || 0;
      const n = ["fog", "clouds", "overcast"].includes(effect) ? Math.round(base * Math.min(k, 1.8)) : Math.round(base * k);
      this.items = [];
      for (let i = 0; i < n; i++) {
        if (RAINY.includes(effect)) {
          const heavy = effect === "heavyrain" || effect === "storm";
          this.items.push({ x: rnd(-40, W), y: rnd(0, H), l: rnd(10, 22), v: rnd(heavy ? 800 : 550, heavy ? 1200 : 800) });
        } else if (effect === "snow") {
          this.items.push({ x: rnd(0, W), y: rnd(0, H), r: rnd(1.5, 4), v: rnd(30, 80), ph: rnd(0, 6.28), amp: rnd(10, 30) });
        } else if (effect === "fog") {
          this.items.push({ x: rnd(0, W), y: rnd(H * .3, H * .95), r: rnd(W * .25, W * .45) * (k > 1 ? .7 : 1), v: rnd(6, 14) });
        } else if (effect === "clouds" || effect === "overcast") {
          this.items.push({ x: rnd(-W * .2, W), y: rnd(-H * .02, H * .38), r: rnd(W * .14, W * .26) * (k > 1 ? .7 : 1), v: rnd(6, 16) });
        } else if (effect === "clear") {
          this.items.push({ x: rnd(0, W), y: rnd(0, H * .45), r: rnd(.6, 1.6), ph: rnd(0, 6.28) });
        }
      }
    }
    blob(x, y, r, rgb, a) {
      const g = this.ctx.createRadialGradient(x, y, 0, x, y, r);
      g.addColorStop(0, `rgba(${rgb},${a})`);
      g.addColorStop(1, `rgba(${rgb},0)`);
      this.ctx.fillStyle = g;
      this.ctx.fillRect(x - r, y - r, r * 2, r * 2);
    }
    draw(dt, t, night) {
      const { ctx, W, H, items } = this;
      ctx.clearRect(0, 0, W, H);
      if (RAINY.includes(effect)) {
        ctx.strokeStyle = night ? "rgba(200,215,255,.5)" : "rgba(235,242,255,.6)";
        ctx.lineWidth = effect === "drizzle" ? 1 : 1.4;
        ctx.beginPath();
        for (const p of items) {
          p.y += p.v * dt; p.x -= p.v * dt * .18;
          if (p.y > H) { p.y = -p.l; p.x = rnd(0, W + 60); }
          if (p.x < -40) p.x = W;
          ctx.moveTo(p.x, p.y);
          ctx.lineTo(p.x + p.l * .18, p.y - p.l);
        }
        ctx.stroke();
        if (effect === "storm") {
          this.nextFlash -= dt;
          if (this.nextFlash <= 0) { this.flash = rnd(.3, .55); this.nextFlash = rnd(3, 9); }
          if (this.flash > 0) {
            ctx.fillStyle = `rgba(255,255,255,${this.flash})`;
            ctx.fillRect(0, 0, W, H);
            this.flash -= dt * 1.6;
          }
        }
      } else if (effect === "snow") {
        ctx.fillStyle = "rgba(255,255,255,.9)";
        for (const p of items) {
          p.y += p.v * dt;
          p.x += Math.sin(t + p.ph) * p.amp * dt;
          if (p.y > H + 5) { p.y = -5; p.x = rnd(0, W); }
          ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.283); ctx.fill();
        }
      } else if (effect === "fog") {
        for (const p of items) {
          p.x += p.v * dt;
          if (p.x - p.r > W) p.x = -p.r;
          this.blob(p.x, p.y, p.r, "255,255,255", night ? .16 : .24);
        }
      } else if (effect === "clouds" || effect === "overcast") {
        const a = effect === "overcast" ? .34 : .26;
        const rgb = night ? "205,215,235" : "255,255,255";
        for (const p of items) {
          p.x += p.v * dt;
          if (p.x - p.r > W) p.x = -p.r * 1.5;
          this.blob(p.x, p.y, p.r, rgb, a);
          this.blob(p.x + p.r * .6, p.y + p.r * .1, p.r * .8, rgb, a * .9);
          this.blob(p.x - p.r * .6, p.y + p.r * .15, p.r * .7, rgb, a * .8);
        }
      } else if (effect === "clear") {
        if (night) {
          for (const p of items) {
            const a = .35 + .45 * Math.sin(t * 1.5 + p.ph);
            ctx.fillStyle = `rgba(255,255,255,${Math.max(a, .1)})`;
            ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.283); ctx.fill();
          }
        } else {
          this.blob(W * .82, H * .14, W * .3, "255,240,180", .38 + .07 * Math.sin(t * .8));
        }
      }
    }
  }

  const cardLayer = new Layer(document.getElementById("fx"), () => {
    const r = card.getBoundingClientRect(); return { w: r.width, h: r.height };
  });
  const pageLayer = new Layer(document.getElementById("fxPage"), () => ({
    w: window.innerWidth, h: window.innerHeight
  }));

  function setEffect(name) {
    if (name === effect && cardLayer.items.length) return;
    effect = name;
    cardLayer.build(); pageLayer.build();
    applySky();
  }

  let last = performance.now(), t = 0;
  function frame(now) {
    const dt = Math.min((now - last) / 1000, .05);
    last = now; t += dt;
    const night = card.classList.contains("night");
    cardLayer.draw(dt, t, night);
    pageLayer.draw(dt, t, night);
    if (!reduceMotion) requestAnimationFrame(frame);
  }

  function resizeAll() { cardLayer.resize(); pageLayer.resize(); }

  window.addEventListener("resize", resizeAll);
  if (FORCED_WX) effect = FORCED_WX;
  guessNight();
  tickClock();
  setInterval(tickClock, 1000);
  resizeAll();
  requestAnimationFrame(frame);
  loadWeather();
  setInterval(loadWeather, 10 * 60 * 1000);
</script>
</body>
</html>
